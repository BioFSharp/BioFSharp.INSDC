<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcIR graph</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#app{display:flex;height:100vh}
#main{flex:1;position:relative;min-width:0}
#graph{width:100%;height:100%;background:#fafafa;cursor:grab;display:block}
#graph:active{cursor:grabbing}
.edge{stroke:#d0d0d0;stroke-width:1}
.elabel{fill:#a0a0a0;font-size:9px;pointer-events:none}
.nlabel{fill:#333;font-size:11px;pointer-events:none}
.node{cursor:pointer}
.node circle{stroke:#fff;stroke-width:1.5}
.node.sel circle{stroke:#222;stroke-width:2.5}
#panel{flex:0 0 auto;width:340px;min-width:220px;max-width:80vw;background:#fff;display:flex}
#pbody{flex:1 1 auto;overflow:auto;padding:16px;min-width:0}
#panel h2{font-size:15px;margin:0 0 8px;word-break:break-word}
#panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#888;margin:16px 0 6px}
.badge{display:inline-block;color:#fff;font-size:11px;padding:2px 9px;border-radius:10px;margin-bottom:10px}
#grip{flex:0 0 8px;cursor:col-resize;background:#e3e3e3;border-right:1px solid #d8d8d8}
#grip:hover{background:#9aa0a6}
.row{padding:5px 0;border-bottom:1px solid #f0f0f0}
.row .k{color:#888;font-size:11px;word-break:break-word;margin-bottom:1px}
.row .v{font-size:13px;word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
#bar{position:absolute;top:10px;left:10px;font-size:12px;color:#555;background:rgba(255,255,255,.88);padding:6px 10px;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#bar button{font-size:11px;margin-left:8px;cursor:pointer}
.hint{color:#aaa}
#legend{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.92);padding:8px 10px;border-radius:6px;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#legend div{display:flex;align-items:center;margin:2px 0}
#legend span{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px}
@media (prefers-color-scheme:dark){
 html,body{background:#1e1e1e;color:#ddd}
 #graph{background:#1e1e1e}
 .edge{stroke:#3a3a3a}.elabel{fill:#777}.nlabel{fill:#ccc}
 #panel{background:#252525}
 #panel h2{color:#eee}
 #grip{background:#333;border-color:#444}#grip:hover{background:#555}
 .row{border-color:#333}.row .k{color:#999}
 #bar,#legend{background:rgba(42,42,42,.92);color:#ccc}
}
</style>
</head>
<body>
<div id="app">
 <div id="main">

  <div id="legend"></div>
 </div>
 <aside id="panel"><div id="grip"></div><div id="pbody"><h2>ArcIR graph</h2><p class="hint">Click a node to see its properties and annotations.</p></div></aside>
</div>

const DATA = {"nodes":[{"id":"DRP003416","label":"DRP003416","kind":"Collection","dtypes":"Study","props":[],"annotations":[["StudyTitle","The gene-body chromatin modifications dynamics mediates epigenome differentiation in Arabidopsis"],["StudyAbstract","Constitutively silent heterochromatin is marked by methylation of lysine 9 on histone H3 (H3K9me). A puzzling feature of H3K9me is that this modification generally localizes not only in promoters but also in internal regions (bodies) of silent transcription units. Despite its prevalence, biological significance of gene-body H3K9me remains enigmatic. Here we show that H3K9me-directed removal of H3K4 monomethylation (H3K4me1) in the gene-bodies mediates transcriptional silencing. Mutations in an Arabidopsis H3K9 demethylase gene IBM1 induce ectopic H3K9me2 accumulation in gene-bodies, which is associated with severe developmental defects. Through suppressor screening of the ibm1- induced developmental defects, we identified LDL2 gene, which encodes a homolog of conserved H3K4 demethylases. The ldl2 mutation suppressed the developmental defects, but it did not suppress the ibm1-induced ectopic H3K9me2. The ectopic H3K9m2 directed reduced body H3K4me1 and transcriptional repression, which depend on the LDL2 function. Furthermore, mutations of H3K9 methylases induced drastic increases in H3K4me1 in the bodies of diverse transposable elements. Our results uncovered an unexpected role of gene-body H3K9me2/H3K4me1 dynamics as a mediator of heterochromatin silencing and epigenome differentiation."],["StudyType","http://purl.org/arc/insdc/enum#StudyDescriptorStudyTypeExistingStudyType/WholeGenomeSequencing"],["ENA-STATUS","PUBLIC"],["ENA-FIRST-PUBLIC","2017-01-28"],["ENA-LAST-UPDATE","2017-01-28"],["primaryId","DRP003416"],["secondaryId","PRJDB5192"],["BioProject","PRJDB5192"],["NIG","DRP003416"]]},{"id":"DRR072816","label":"DRR072816","kind":"Activity","dtypes":"Run","props":[],"annotations":[["Title","WT_H3_1"],["ENA-STATU aryStrategy","http://purl.org/arc/insdc/enum#LibraryStrategy/RnaSeq"]],"annotations":[]},{"id":"DRX066839","label":"DRX066839","kind":"Activity","dtypes":"Assay Experiment","props":[],"annotations":[["Title","suvh456_RNA_B2"],["ENA-STATUS","PUBLIC"],["primaryId","DRX066839"],["NIG","DRX066839"]]},{"id":"DRX066839#library","label":"DRX066839#library","kind":"Recipe","dtypes":"Protocol","props":[["LibraryConstructionProtocol","KAPA Stranded mRNA-Seq Kit"],["LibrarySelection","http://purl.org/arc/insdc/enum#LibrarySelection/PolyA"],["LibrarySource","http://purl.org/arc/insdc/enum#LibrarySource/Transcriptomic"],["LibraryStrategy","http://purl.org/arc/insdc/enum#LibraryStrategy/RnaSeq"]],"annotations":[]},{"id":"DRX066840","label":"DRX066840","kind":"Activity","dtypes":"Assay Experiment","props":[],"annotations":[["Title","suvh456_RNA_B3"],["ENA-STATUS","PUBLIC"],["primaryId","DRX066840"],["NIG","DRX066840"]]},{"id":"DRX066840#library","label":"DRX066840#library","kind":"Recipe","dtypes":"Protocol","props":[["LibraryConstructionProtocol","KAPA Stranded mRNA-Seq Kit"],["LibrarySelection","http://purl.org/arc/insdc/enum#LibrarySelection/PolyA"],["LibrarySource","http://purl.org/arc/insdc/enum#LibrarySource/Transcriptomic"],["LibraryStrategy","http://purl.org/arc/insdc/enum#LibraryStrategy/RnaSeq"]],"annotations":[]},{"id":"PRJDB5192","label":"PRJDB5192","kind":"Collection","dtypes":"BioProject Investigation","props":[],"annotations":[["Alias","PRJDB5192"],["Name","Arabidopsis thaliana strain:Col-0"],["Title","The gene-body chromatin modifications dynamics mediates epigenome differentiation in Arabidopsis"],["Description","Constitutively silent heterochromatin is marked by methylation of lysine 9 on histone H3 (H3K9me). A puzzling feature of H3K9me is that this modification generally localizes not only in promoters but also in internal regions (bodies) of silent transcription units. Despite its prevalence, biological significance of gene-body H3K9me remains enigmatic. Here we show that H3K9me-directed removal of H3K4 monomethylation (H3K4me1) in the gene-bodies mediates transcriptional silencing. Mutations in an Arabidopsis H3K9 demethylase gene IBM1 induce ectopic H3K9me2 accumulation in gene-bodies, which is associated with severe developmental defects. Through suppressor screening of the ibm1- induced developmental defects, we identified LDL2 gene, which encodes a homolog of conserved H3K4 demethylases. The ldl2 mutation suppressed the developmental defects, but it did not suppress the ibm1-induced ectopic H3K9me2. The ectopic H3K9m2 directed reduced body H3K4me1 and transcriptional repression, which depend on the LDL2 function. Furthermore, mutations of H3K9 methylases induced drastic increases in H3K4me1 in the bodies of diverse transposable elements. Our results uncovered an unexpected role of gene-body H3K9me2/H3K4me1 dynamics as a mediator of heterochromatin silencing and epigenome differentiation."],["ENA-REFSEQ","N"],["PROJECT-ID","362567"],["NCBI-PROJECT-TYPE","SUBMISSION"],["ENA-STATUS","PUBLIC"],["ENA-FIRST-PUBLIC","2017-04-19"],["ENA-LAST-UPDATE","2026-07-01"],["primaryId","PRJDB5192"],["secondaryId","DRP003416"],["Kakutani lab, Department of Integrative Genetics, National Institute of Genetics","PRJDB5192"]]},{"id":"SAMD00064197","label":"SAMD00064197","kind":"Observable","dtypes":"BioSample Sample","props":[],"annotations":[["Title","WT Col-0"],["Description","reference"],["INSDC secondary accession","DRS039895"],["NCBI submission package","Generic.1.0"],["organism","Arabidopsis thaliana"],["ecotype","Col-0"],["sample_name","WT"],["BioSampleModel","Generic"],["ENA-FIRST-PUBLIC","2017-01-18"],["ENA-LAST-UPDATE","2023-10-29"],["primaryId","SAMD00064197"],["secondaryId","DRS039895"],["BioSample","SAMD00064197"]]},{"id":"SAMD00064198","label":"SAMD00064198","kind":"Observable","dtypes":"BioSample Sample","props":[],"annotations":[["Title","ibm1-4"],["Description","mutant"],["INSDC secondary accession","DRS039896"],["NCBI s const svg=document.getElementById('graph');

const r0=svg.getBoundingClientRect();

 for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<0.01){d2=0.01;dx=Math.random()-0.5;dy=Math.random()-0.5;}const d=Math.sqrt(d2),f=7000/d2,fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
